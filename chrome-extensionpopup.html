<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Keyboard Control</title>
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 15px 0;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.active {
            background: #00ff00;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .platform-selector {
            margin: 15px 0;
        }

        .platform-selector label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .platform-selector select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button.primary {
            background: #4CAF50;
            color: white;
        }

        button.primary:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            font-size: 12px;
            line-height: 1.5;
        }

        .info h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .info ul {
            margin: 5px 0;
            padding-left: 20px;
        }

        .info li {
            margin: 3px 0;
        }

        .settings {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #4CAF50;
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <h1>🖐️ Gesture Keyboard</h1>
    
    <div class="container">
        <div class="status">
            <span>Connection Status:</span>
            <div class="status-indicator" id="statusIndicator"></div>
        </div>

        <div class="platform-selector">
            <label for="platformSelect">Search Platform:</label>
            <select id="platformSelect">
                <option value="google">Google Search</option>
                <option value="youtube">YouTube</option>
                <option value="instagram">Instagram</option>
                <option value="browser">Browser (Bing)</option>
            </select>
        </div>

        <div class="settings">
            <div class="setting-item">
                <span>Voice Feedback</span>
                <div class="toggle-switch" id="voiceToggle">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-item">
                <span>High Contrast</span>
                <div class="toggle-switch" id="contrastToggle">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="primary" id="connectBtn">Connect</button>
            <button class="secondary" id="settingsBtn">Settings</button>
        </div>

        <div class="info">
            <h3>Gesture Controls:</h3>
            <ul>
                <li>👆 Pinch: Type/Select keys</li>
                <li>👋 Open hand 3s: Toggle keyboard</li>
                <li>👈 Swipe: Switch platform</li>
                <li>✌️ Two fingers up: High contrast</li>
                <li>🤘 Two fingers down: Voice toggle</li>
            </ul>
        </div>
    </div>

    <script>
        // Get elements
        const statusIndicator = document.getElementById('statusIndicator');
        const platformSelect = document.getElementById('platformSelect');
        const connectBtn = document.getElementById('connectBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const voiceToggle = document.getElementById('voiceToggle');
        const contrastToggle = document.getElementById('contrastToggle');

        // Load saved settings
        chrome.storage.local.get(['platform', 'voiceFeedback', 'highContrast'], (result) => {
            if (result.platform) {
                platformSelect.value = result.platform;
            }
            if (result.voiceFeedback) {
                voiceToggle.classList.add('active');
            }
            if (result.highContrast) {
                contrastToggle.classList.add('active');
            }
        });

        // Platform selector
        platformSelect.addEventListener('change', () => {
            chrome.storage.local.set({ platform: platformSelect.value });
            chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                chrome.tabs.sendMessage(tabs[0].id, {
                    type: 'changePlatform',
                    platform: platformSelect.value
                });
            });
        });

        // Connect button
        connectBtn.addEventListener('click', () => {
            if (statusIndicator.classList.contains('active')) {
                statusIndicator.classList.remove('active');
                connectBtn.textContent = 'Connect';
                chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                    chrome.tabs.sendMessage(tabs[0].id, { type: 'disconnect' });
                });
            } else {
                statusIndicator.classList.add('active');
                connectBtn.textContent = 'Disconnect';
                chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                    chrome.tabs.sendMessage(tabs[0].id, { type: 'connect' });
                });
            }
        });

        // Voice feedback toggle
        voiceToggle.addEventListener('click', () => {
            voiceToggle.classList.toggle('active');
            const enabled = voiceToggle.classList.contains('active');
            chrome.storage.local.set({ voiceFeedback: enabled });
            chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                chrome.tabs.sendMessage(tabs[0].id, {
                    type: 'toggleVoice',
                    enabled: enabled
                });
            });
        });

        // High contrast toggle
        contrastToggle.addEventListener('click', () => {
            contrastToggle.classList.toggle('active');
            const enabled = contrastToggle.classList.contains('active');
            chrome.storage.local.set({ highContrast: enabled });
            chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                chrome.tabs.sendMessage(tabs[0].id, {
                    type: 'toggleContrast',
                    enabled: enabled
                });
            });
        });

        // Settings button
        settingsBtn.addEventListener('click', () => {
            alert('Advanced settings coming soon!\n\nFor now, use the desktop application for full gesture training and customization.');
        });

        // Check connection status on load
        chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
            chrome.tabs.sendMessage(tabs[0].id, { type: 'checkStatus' }, (response) => {
                if (response && response.connected) {
                    statusIndicator.classList.add('active');
                    connectBtn.textContent = 'Disconnect';
                }
            });
        });
    </script>
</body>
</html>
